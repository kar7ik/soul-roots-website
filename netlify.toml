[build]
  # Directory to publish (the root directory)
  publish = "."
  # Compiles assets/css/tailwind-input.css -> assets/css/tailwind.css
  command = "npm run build:css"

[build.environment]
  # Node version for Netlify Functions and the build step (Tailwind CSS v4 requires Node 20+)
  NODE_VERSION = "20"

# Netlify Functions configuration
[functions]
  # Directory where functions are located
  directory = "netlify/functions"
  # Node version for functions
  node_bundler = "esbuild"

# No SPA catch-all redirect: this is a multi-page static site, not a single-page app.
# Unmatched URLs fall through to 404.html automatically.

# Headers for security and CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Static assets: cache for a week, browsers revalidate after that
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
